# Host-specific values (IPs, db_host, app_backend_host, aws_region...) come from the
# Terraform-generated inventory/hosts.ini.

# Source archive (README's URL points at the b89 org; this is the b90 repo you linked)
roboshop_zip_url: "https://raw.githubusercontent.com/raghudevopsb90/roboshop-monolith/main/roboshop-monolith.zip"

# Set -e roboshop_redeploy=true to re-download + rebuild a new release
roboshop_redeploy: false

app_port: 8080
app_health_path: /health

db_port: 3306
db_name: roboshop
db_user: roboshop
# Fetched from SSM Parameter Store on the control node (needs AWS creds + boto3).
db_password: "{{ lookup('amazon.aws.aws_ssm', db_password_ssm_param, region=aws_region) }}"
